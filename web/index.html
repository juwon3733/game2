<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>같은 하루, 다른 칸 — 1장 낙하</title>
<link rel="stylesheet" href="fonts/galmuri.css">
<link rel="stylesheet" href="css/game.css">
<link rel="icon" href="favicon.svg">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <img id="bg" alt="">
    <div id="chars"></div>
    <img id="cg" alt="">

    <canvas id="explore" width="1280" height="720" class="hidden"></canvas>
    <div id="pad" class="hidden">
      <button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
      <button id="pad-a">조사</button>
    </div>

    <div id="trial" class="hidden">
      <div class="tr-gauge"><span class="tr-label">증인의 마음</span><span id="tr-ink"></span></div>
      <div id="tr-panel" class="tr-panel"></div>
    </div>

    <div id="puzzle" class="hidden"></div>

    <div id="goal" class="hidden"></div>
    <div id="hud">
      <button id="btn-log" class="hud-btn small" title="대사 기록">로그</button>
      <button id="btn-auto" class="hud-btn small" title="자동 진행">자동</button>
      <button id="btn-skip" class="hud-btn small" title="빨리 넘기기 (Ctrl)">빨리</button>
      <button id="btn-set" class="hud-btn small" title="설정">설정</button>
      <button id="btn-note" class="hud-btn">수첩</button>
    </div>

    <div id="textbox" class="hidden">
      <div id="tb-name"></div>
      <div id="tb-text"></div>
      <div id="tb-next">▼</div>
    </div>
    <div id="actions" class="hidden"></div>
    <div id="choices" class="hidden"></div>

    <div id="modal" class="hidden"></div>
    <div id="banner" class="hidden"></div>
    <div id="toast" class="hidden"></div>
    <div id="flash"></div>
    <div id="fade"></div>
  </div>
</div>

<script src="js/audio.js"></script>
<script src="js/data_ch1.js"></script>
<script src="js/assets.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/explore.js"></script>
<script src="js/trial.js"></script>
<script src="js/puzzle.js"></script>
<script src="js/script_ch1.js"></script>
</body>
</html>
