name: 에셋 검사

on:
  pull_request:
    paths: ['web/**', 'tools/**', 'docs/PROMPTS_CH1.md', '.github/workflows/assets-check.yml']
  push:
    branches: [main]
    paths: ['web/**', 'tools/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 프롬프트 파일이 게임 데이터와 맞는지
        run: node tools/export-prompts.mjs --check
      - name: 파일명 · 형식 · 크기 검사
        run: node tools/check-assets.mjs
      - name: 대사 점검 (AI 티·반복·조사)
        run: node tools/lint-text.mjs

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 브라우저 설치
        run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: 모든 장면을 열어 오류 검사
        run: node tools/smoke.mjs
      - name: 장마다 처음부터 끝까지 정답으로 풀어 보기
        run: node tools/playthrough.mjs
